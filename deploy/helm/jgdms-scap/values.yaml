# JGDMS SCAP Helm chart — default values
#
# Override individual values with --set or a custom values.yaml file:
#   helm install jgdms-scap ./deploy/helm/jgdms-scap \
#     --set global.trustDomain=jgdms.example.org \
#     --set global.imageRegistry=my-registry.example.org

# ── Global settings ────────────────────────────────────────────────────────────
global:
  # SPIFFE trust domain used in every policy file and SPIRE registration entry.
  # MUST be overridden for production deployments.
  trustDomain: "jgdms.example.org"

  # Container registry prefix prepended to all image names.
  imageRegistry: ""

  # JGDMS Maven artifact version baked into every image.
  jgdmsVersion: "3.1.1-SNAPSHOT"

  # DirtyChai JDK image tag.  Pinning to a specific release is strongly
  # recommended for production deployments — the 'latest' tag tracks the
  # rolling dirty-chai-latest GitHub Release.
  dirtychaiTag: "latest"

  # Path inside pods where SPIRE agent writes SVID PEM files.
  spireDir: "/run/spire"

  # Kubernetes namespace for all SCAP services.
  namespace: "jgdms-scap"

  # DNS name of the Jini Lookup Service within the cluster.
  # This must match the Kubernetes Service name in host1-lookup.
  lookupUrl: "jini://lookup.jgdms-scap.svc.cluster.local:4160"

# ── Host 1 — Jini Lookup Service ──────────────────────────────────────────────
host1:
  enabled: true
  image:
    repository: jgdms/host1-lookup
    tag: ""   # defaults to global.jgdmsVersion
    pullPolicy: IfNotPresent
  replicas: 1
  jeriPort: 4160
  codebasePort: 9080
  logDir: "/opt/jgdms/log"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  # Set to true to use a PVC for the Reggie state log.
  persistence:
    enabled: false
    storageClass: ""
    size: "2Gi"

# ── Host 2 — Bytecode Analysis Engine ─────────────────────────────────────────
host2:
  enabled: true
  image:
    repository: jgdms/host2-bae
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  jeriPort: 1098
  # Require SELinux-enforcing nodes.  Set to false on clusters that do not
  # support custom SELinux policy modules (e.g. managed GKE/EKS/AKS).
  requireSelinuxNodes: true
  # SELinux process type from jgdms_bae.te.
  selinuxType: "jgdms_bae_t"
  # Engine signing key configuration.
  # Set existingSecret to the name of a pre-created Kubernetes Secret
  # containing engine-signing-key.pem and engine-signing-cert.pem.
  # If empty, a placeholder Secret named 'bae-engine-signing-key' is created;
  # you MUST populate it before BAE pods will function.
  signingKey:
    existingSecret: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # ── Crash-guard init container ──────────────────────────────────────────────
  # When enabled, a crash-guard init container runs before every BAE container
  # start.  If a job-marker file (/tmp/current-job) was left by a previous BAE
  # crash, the init container annotates the pod with a pending crash verdict
  # that the Downloader (host4) forwards to the VerdictRegistry (host3).
  #
  # BAE application requirement: the BAE implementation MUST write the SHA-256
  # digest of the JAR it is currently analysing to /tmp/current-job before
  # beginning analysis, and delete it after successful completion.  The preStop
  # lifecycle hook configured in this chart clears the marker automatically on
  # graceful SIGTERM-initiated shutdown.
  crashGuard:
    enabled: true

    # Image used for the crash-guard init container.
    # bitnami/kubectl provides a minimal Alpine image with kubectl pre-installed.
    image:
      repository: bitnami/kubectl
      tag: ""            # defaults to "latest"
      pullPolicy: IfNotPresent

    # Number of container restarts after which the verdict is escalated from
    # SUSPICIOUS_* / ANALYSIS_ERROR to DANGEROUS.  Should match the
    # CrashLoopBackOff restart threshold expected from Kubernetes (typically 5).
    crashLoopThreshold: 5

    # Lifetime (seconds) of the projected ServiceAccount token injected into
    # the crash-guard init container for Kubernetes API access.  The token is
    # only valid for this short window; the main BAE container does not receive
    # it (automountServiceAccountToken remains false at the pod level).
    tokenExpirationSeconds: 600

    # Kubernetes API server egress CIDR for the BAE NetworkPolicy.
    # The crash-guard init container calls the Kubernetes API on port 443 to
    # read pod status (exit code, restart count) and patch annotations.
    # Set to your cluster's service CIDR for tighter isolation.
    # Examples:
    #   kubeadm default:  "10.96.0.0/12"
    #   GKE default:      "10.0.0.0/8"
    # Leave as "0.0.0.0/0" if the API server IP is unknown (e.g. managed k8s
    # with a public endpoint).
    apiServerCidr: "0.0.0.0/0"

# ── Host 3 — Verdict Registry ─────────────────────────────────────────────────
host3:
  enabled: true
  image:
    repository: jgdms/host3-registry
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  jeriPort: 1098
  codebasePort: 9080
  # Quorum: minimum number of distinct BAE SAFE verdicts required.
  quorum: 2
  persistence:
    storageClass: ""
    size: "10Gi"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Host 4 — Codebase Downloader ──────────────────────────────────────────────
host4:
  enabled: true
  image:
    repository: jgdms/host4-downloader
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  jeriPort: 1098
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Host 5 — JFR Telemetry Service ────────────────────────────────────────────
host5:
  enabled: true
  image:
    repository: jgdms/host5-telemetry
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  jeriPort: 1098
  codebasePort: 9080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── NetworkPolicy ──────────────────────────────────────────────────────────────
networkPolicy:
  # Set to false only if your CNI does not support NetworkPolicy.
  enabled: true

# ── SPIRE integration ──────────────────────────────────────────────────────────
spire:
  # Path on the host node where the SPIRE agent writes SVID files.
  # This must match the DaemonSet configuration in spire-agent.yaml.
  hostSvidPath: "/run/spire/svid"

# ── Prometheus / Prometheus Operator integration ───────────────────────────────
prometheus:
  # Set enabled: true if the Prometheus Operator CRD (PrometheusRule) is
  # installed in the cluster.  Renders bae-crashloop-alert.yaml.
  prometheusOperator:
    enabled: false
    # Additional labels to add to every PrometheusRule so that your
    # Prometheus instance selects it (via ruleSelector.matchLabels).
    # Example:
    #   ruleLabels:
    #     release: kube-prometheus-stack
    ruleLabels: {}

  # How often Prometheus evaluates the BAE crash alert rules.
  evaluationInterval: "30s"

  # Per-alert tuning.
  baeAlerts:
    # How long a pod must be in CrashLoopBackOff before firing the critical alert.
    crashLoopFor: "1m"
    # How long the frequent-crash condition must hold before firing the warning.
    # "0m" means fire immediately on the first evaluation that satisfies the expr.
    frequentCrashFor: "0m"
