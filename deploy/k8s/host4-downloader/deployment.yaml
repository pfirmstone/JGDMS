# Host 4 — Codebase Downloader Service
#
# The ONLY SCAP host with outbound internet access.
# NetworkPolicy allows egress to the internet for JAR downloads.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jgdms-downloader
  namespace: jgdms-scap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: host4-downloader-config
  namespace: jgdms-scap
data:
  JGDMS_JERI_PORT:  "1098"
  JGDMS_LOOKUP_URL: "jini://lookup.jgdms-scap.svc.cluster.local:4160"
  TRUST_DOMAIN:     "jgdms.example.org"
  SPIRE_DIR:        "/run/spire"
  JGDMS_VERSION:    "3.1.1-SNAPSHOT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host4-downloader
  namespace: jgdms-scap
  labels:
    app: host4-downloader
    scap-role: downloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host4-downloader
  template:
    metadata:
      labels:
        app: host4-downloader
        scap-role: downloader
    spec:
      serviceAccountName: jgdms-downloader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: downloader
          image: jgdms/host4-downloader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: jeri
              containerPort: 1098
              protocol: TCP
          envFrom:
            - configMapRef:
                name: host4-downloader-config
          env:
            - name: JGDMS_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: spire-svid
              mountPath: /run/spire
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spire-svid
          hostPath:
            path: /run/spire/svid
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: downloader
  namespace: jgdms-scap
  labels:
    app: host4-downloader
    scap-role: downloader
spec:
  selector:
    app: host4-downloader
  ports:
    - name: jeri
      port: 1098
      targetPort: 1098
      protocol: TCP
  type: ClusterIP
