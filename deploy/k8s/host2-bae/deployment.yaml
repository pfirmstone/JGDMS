# Host 2 — Bytecode Analysis Engine (BAE) pool
#
# Stateless Deployment of N replicas.  Each replica has its own engine
# signing key pair provisioned as a Kubernetes Secret named
# bae-engine-signing-key-<n>.
#
# Nodes running BAE pods should be tainted with:
#   node-role.kubernetes.io/selinux-enforcing=true:NoSchedule
# and carry the label selinux-enforcing=true so that this Deployment
# can use a matching toleration + nodeSelector.
#
# The seccompProfile and readOnlyRootFilesystem further harden the BAE
# at the container level.  The primary network isolation is enforced by
# the NetworkPolicy in network-policy.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jgdms-bae
  namespace: jgdms-scap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: host2-bae-config
  namespace: jgdms-scap
data:
  JGDMS_JERI_PORT:  "1098"
  JGDMS_LOOKUP_URL: "jini://lookup.jgdms-scap.svc.cluster.local:4160"
  TRUST_DOMAIN:     "jgdms.example.org"
  SPIRE_DIR:        "/run/spire"
  JGDMS_VERSION:    "3.1.1-SNAPSHOT"
---
# Engine signing key Secret — one per replica.
# IMPORTANT: The data fields MUST be populated with real key material before
# deploying BAE pods.  See deploy/README.md §"BAE engine signing keys" for
# key generation instructions.  Empty data values will cause BAE pods to
# fail to start.
#
# Pre-create this Secret externally before applying this manifest:
#   kubectl create secret generic bae-engine-signing-key \
#     --namespace jgdms-scap \
#     --from-file=engine-signing-key.pem \
#     --from-file=engine-signing-cert.pem
apiVersion: v1
kind: Secret
metadata:
  name: bae-engine-signing-key
  namespace: jgdms-scap
  annotations:
    "jgdms.io/requires-operator-action": "true"
type: Opaque
data:
  # Replace with base64-encoded PEM private key and matching certificate.
  # DO NOT commit real key material to source control.
  engine-signing-key.pem:  ""
  engine-signing-cert.pem: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host2-bae
  namespace: jgdms-scap
  labels:
    app: host2-bae
    scap-role: bae
    app.kubernetes.io/component: bae
spec:
  replicas: 2   # Increase for higher quorum / redundancy
  selector:
    matchLabels:
      app: host2-bae
  template:
    metadata:
      labels:
        app: host2-bae
        scap-role: bae
    spec:
      serviceAccountName: jgdms-bae
      # Keep automountServiceAccountToken false at the pod level.
      # The crash-guard init container receives a short-lived projected
      # ServiceAccount token via an explicit volume (see volumes below).
      # The main BAE container does NOT receive any SA token.
      automountServiceAccountToken: false
      # Run on SELinux-enforcing nodes only
      nodeSelector:
        selinux-enforcing: "true"
      tolerations:
        - key: "node-role.kubernetes.io/selinux-enforcing"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        # SELinux label for the BAE process — matches the custom .te module
        seLinuxOptions:
          type: jgdms_bae_t
      # ── Crash-guard init container ────────────────────────────────────────
      # Runs before the BAE container on every pod start.  Detects mid-analysis
      # crashes by checking for a residual /tmp/current-job marker, classifies
      # the crash by exit code, and patches the pod with pending-crash-verdict
      # annotations for the Downloader (host4) to forward to the VerdictRegistry.
      initContainers:
        - name: crash-guard
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/crash-guard.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CRASH_LOOP_THRESHOLD
              value: "5"
          volumeMounts:
            - name: crash-guard-script
              mountPath: /scripts
              readOnly: true
            - name: crash-guard-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: crash-guard-tmp
              mountPath: /crash-guard-tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: bae
          image: jgdms/host2-bae:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: jeri
              containerPort: 1098
              protocol: TCP
          envFrom:
            - configMapRef:
                name: host2-bae-config
          env:
            - name: JGDMS_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: JGDMS_ENGINE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENGINE_SIGNING_KEY
              value: "/opt/jgdms/keys/engine-signing-key.pem"
            - name: ENGINE_SIGNING_CERT
              value: "/opt/jgdms/keys/engine-signing-cert.pem"
          # ── preStop hook: clear the job marker on graceful shutdown ──────────
          # When Kubernetes terminates the BAE container gracefully (SIGTERM),
          # this hook removes /tmp/current-job before SIGTERM is sent.
          # This prevents the crash-guard init container from generating a false
          # SUSPICIOUS verdict on the next container restart (e.g. after a
          # rolling update or a liveness-probe-triggered restart).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -f /tmp/current-job"]
          volumeMounts:
            - name: spire-svid
              mountPath: /run/spire
              readOnly: true
            - name: engine-signing-key
              mountPath: /opt/jgdms/keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spire-svid
          hostPath:
            path: /run/spire/svid
            type: Directory
        - name: engine-signing-key
          secret:
            secretName: bae-engine-signing-key
        - name: tmp
          emptyDir: {}
        # Script ConfigMap for the crash-guard init container.
        - name: crash-guard-script
          configMap:
            name: bae-crash-guard-script
            defaultMode: 0555
        # Projected ServiceAccount token — short-lived (600s), init container only.
        # The main BAE container does NOT have access to this volume.
        - name: crash-guard-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        # Scratch space for the crash-guard init container (kubectl cache, etc.).
        - name: crash-guard-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bae
  namespace: jgdms-scap
  labels:
    app: host2-bae
    scap-role: bae
spec:
  selector:
    app: host2-bae
  ports:
    - name: jeri
      port: 1098
      targetPort: 1098
      protocol: TCP
  type: ClusterIP
