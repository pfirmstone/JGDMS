# Host 5 — JFR Telemetry Service
#
# Reactive service: receives VirtualThreadPinned JFR events from clients,
# re-triggers BAE analysis, and submits updated verdicts to Host 3.
# NO direct connection to Host 4.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jgdms-telemetry
  namespace: jgdms-scap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: host5-telemetry-config
  namespace: jgdms-scap
data:
  JGDMS_JERI_PORT:     "1098"
  JGDMS_CODEBASE_PORT: "9080"
  JGDMS_LOOKUP_URL:    "jini://lookup.jgdms-scap.svc.cluster.local:4160"
  TRUST_DOMAIN:        "jgdms.example.org"
  SPIRE_DIR:           "/run/spire"
  JGDMS_VERSION:       "3.1.1-SNAPSHOT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host5-telemetry
  namespace: jgdms-scap
  labels:
    app: host5-telemetry
    scap-role: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host5-telemetry
  template:
    metadata:
      labels:
        app: host5-telemetry
        scap-role: telemetry
    spec:
      serviceAccountName: jgdms-telemetry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry
          image: jgdms/host5-telemetry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: jeri
              containerPort: 1098
              protocol: TCP
          envFrom:
            - configMapRef:
                name: host5-telemetry-config
          env:
            - name: JGDMS_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: spire-svid
              mountPath: /run/spire
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1098
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: spire-svid
          hostPath:
            path: /run/spire/svid
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
  namespace: jgdms-scap
  labels:
    app: host5-telemetry
    scap-role: telemetry
spec:
  selector:
    app: host5-telemetry
  ports:
    - name: jeri
      port: 1098
      targetPort: 1098
      protocol: TCP
    - name: codebase
      port: 9080
      targetPort: 9080
      protocol: TCP
  type: ClusterIP
