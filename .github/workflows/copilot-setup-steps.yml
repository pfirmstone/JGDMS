name: "Copilot Setup Steps"

# Run automatically when this file changes so the setup can be validated in CI,
# and allow manual re-runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Lowest permissions needed for the setup steps below.
    # Copilot will be given its own token for its actual task operations.
    permissions:
      contents: read

    steps:
      # Check out the repository so that:
      #   - hashFiles() can locate all pom.xml files for the Maven cache key, and
      #   - mvn dependency:go-offline can resolve the project dependency graph.
      # Copilot will re-check out the repository (with its own token) after these
      # setup steps complete.
      - name: Checkout code
        uses: actions/checkout@v4

      # Attempt to install the latest DirtyChai JDK release (linux-x64).
      # DirtyChai is a community OpenJDK fork that re-enables SecurityManager /
      # AccessController functionality required by JGDMS tests.
      #
      # This step is a no-op when no release exists yet in pfirmstone/DirtyChai,
      # so the workflow will still succeed and use the runner's system JDK instead.
      - name: Install DirtyChai JDK
        id: dirtychai
        run: |
          INSTALL_DIR="/opt/dirtychai"
          sudo mkdir -p "$INSTALL_DIR"

          # gh release download exits non-zero when no matching release is found;
          # the `|| true` ensures we continue gracefully in that case.
          if gh release download \
               --repo pfirmstone/DirtyChai \
               --pattern 'jdk-linux-x64.tar.gz' \
               --dir /tmp/dirtychai-dl 2>/dev/null; then

            echo "DirtyChai release bundle found; installing..."
            sudo tar -xzf /tmp/dirtychai-dl/jdk-linux-x64.tar.gz -C "$INSTALL_DIR"

            # The tarball expands into a versioned sub-directory (e.g. jdk-24.0.1+7).
            # Walk the tree to find the real JAVA_HOME regardless of the version string.
            JDK_DIR="$(dirname "$(find "$INSTALL_DIR" -name 'javac' -type f | head -1)")"
            JDK_DIR="${JDK_DIR%/bin}"

            echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
            echo "$JDK_DIR/bin"       >> "$GITHUB_PATH"
            echo "installed=true"     >> "$GITHUB_OUTPUT"

            echo "DirtyChai JDK installed at $JDK_DIR"
            "$JDK_DIR/bin/java" -version
          else
            echo "No DirtyChai release available yet; the system JDK will be used."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Cache the Maven local repository so repeated agent sessions do not need
      # to re-download the same artifacts from Maven Central.
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('JGDMS/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Pre-populate the Maven cache.  continue-on-error is set so that a
      # transient network failure or a missing DirtyChai-specific API does not
      # block the rest of the agent setup.
      - name: Pre-warm Maven dependencies
        working-directory: JGDMS
        run: mvn dependency:go-offline -DskipTests -q --no-transfer-progress
        continue-on-error: true
