name: "SPIFFE Unit Tests"

# Runs the four-stage SPIFFE JUnit tests on every push / PR that touches the
# JERI module or the SPIFFE test resources, and can be triggered manually.
#
# Two Java variants are exercised:
#   1. Temurin 21 (via actions/setup-java) — always runs.
#      jgdms-platform and jgdms-jeri require --release 21, so JDK 21 is the
#      minimum version needed to compile the project.
#   2. DirtyChai JDK — runs only when the dirty-chai-latest release is
#      available at pfirmstone/DirtyChai.
#      DirtyChai is a community OpenJDK fork that re-enables SecurityManager /
#      AccessController, which is required for full JGDMS security testing.

on:
  workflow_dispatch:
  push:
    paths:
      - 'JGDMS/jgdms-jeri/**'
      - 'JGDMS/jgdms-platform/**'
      - 'JGDMS/jgdms-collections/**'
      - 'JGDMS/jgdms-activation-parameters/**'
      - 'qa/harness/trust/spiffe/**'
      - 'qa/harness/trust/spiffelogins'
      - '.github/workflows/spiffe-unit-tests.yml'
  pull_request:
    paths:
      - 'JGDMS/jgdms-jeri/**'
      - 'JGDMS/jgdms-platform/**'
      - 'JGDMS/jgdms-collections/**'
      - 'JGDMS/jgdms-activation-parameters/**'
      - 'qa/harness/trust/spiffe/**'
      - 'qa/harness/trust/spiffelogins'
      - '.github/workflows/spiffe-unit-tests.yml'

jobs:
  spiffe-tests:
    name: "SPIFFE tests (${{ matrix.jdk-label }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk-label: "Temurin-21"
            use-dirtychai: false
            java-version: '21'
          - jdk-label: "DirtyChai (if available)"
            use-dirtychai: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Install JDK 21 via actions/setup-java for the Temurin matrix leg.
      # jgdms-platform and jgdms-jeri require --release 21; the ubuntu-latest
      # runner only ships JDK 17 by default so we must install 21 explicitly.
      # The DirtyChai leg skips this step and uses its own JDK (set below).
      # -----------------------------------------------------------------------
      - name: Set up JDK 21 (Temurin)
        if: ${{ !matrix.use-dirtychai }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      # -----------------------------------------------------------------------
      # Install DirtyChai JDK (only for the DirtyChai matrix variant).
      # Degrades gracefully when the dirty-chai-latest release is absent.
      # -----------------------------------------------------------------------
      - name: Install DirtyChai JDK
        id: dirtychai
        if: matrix.use-dirtychai
        run: |
          INSTALL_DIR="/opt/dirtychai"
          DL_DIR="/tmp/dirtychai-dl"
          sudo mkdir -p "$INSTALL_DIR"
          mkdir -p "$DL_DIR"

          if gh release download dirty-chai-latest \
               --repo pfirmstone/DirtyChai \
               --pattern 'jdk-linux-x64.tar.gz' \
               --pattern 'jdk-linux-x64.tar.gz.sha256' \
               --dir "$DL_DIR"; then

            echo "DirtyChai release bundle found; verifying checksum..."
            (cd "$DL_DIR" && sha256sum -c jdk-linux-x64.tar.gz.sha256)

            echo "Checksum OK; installing..."
            sudo tar -xzf "$DL_DIR/jdk-linux-x64.tar.gz" -C "$INSTALL_DIR"

            JDK_DIR="$(dirname "$(find "$INSTALL_DIR" -name 'javac' -type f | head -1)")"
            JDK_DIR="${JDK_DIR%/bin}"

            echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
            echo "$JDK_DIR/bin"       >> "$GITHUB_PATH"
            echo "installed=true"     >> "$GITHUB_OUTPUT"

            echo "DirtyChai JDK installed at $JDK_DIR"
            "$JDK_DIR/bin/java" -version
          else
            echo "No DirtyChai release available; skipping DirtyChai matrix run."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Skip remaining steps when DirtyChai was requested but unavailable.
      - name: Check DirtyChai availability
        id: check
        if: matrix.use-dirtychai
        run: |
          if [ "${{ steps.dirtychai.outputs.installed }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Maven dependency cache
      # -----------------------------------------------------------------------
      - name: Cache Maven local repository
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-spiffe-${{ hashFiles('JGDMS/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-spiffe-
            ${{ runner.os }}-maven-

      # -----------------------------------------------------------------------
      # Pre-install Pack200-ex-openjdk from GitHub Releases into the local
      # Maven repository.  The artifact is published as a release binary at
      # github.com/pfirmstone/Pack200-ex-openjdk, not via GitHub Packages.
      # -----------------------------------------------------------------------
      - name: Install Pack200-ex-openjdk into local Maven repository
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PACK_VER=$(grep -m1 '<pack200.version>' pom.xml | sed 's|.*<pack200.version>\(.*\)</pack200.version>.*|\1|')
          mkdir -p /tmp/pack200-dl
          gh release download "${PACK_VER}" \
            --repo pfirmstone/Pack200-ex-openjdk \
            --pattern "Pack200-ex-openjdk-${PACK_VER}.jar" \
            --dir /tmp/pack200-dl
          mvn install:install-file \
            -Dfile="/tmp/pack200-dl/Pack200-ex-openjdk-${PACK_VER}.jar" \
            -DgroupId=au.net.zeus.pack200-ex-openjdk \
            -DartifactId=Pack200-ex-openjdk \
            -Dversion="${PACK_VER}" \
            -Dpackaging=jar \
            --no-transfer-progress -q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Build dependencies (jgdms-platform + jgdms-jeri) — skip tests here.
      # -----------------------------------------------------------------------
      - name: Build dependencies
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          mvn install -DskipTests \
            -pl jgdms-platform,jgdms-jeri --also-make \
            --no-transfer-progress -q
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 1 — SpiffePrincipalTest
      # -----------------------------------------------------------------------
      - name: "Stage 1: SpiffePrincipalTest"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-jeri \
            -Dtest=SpiffePrincipalTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 2 — FileSvidSourceTest
      # -----------------------------------------------------------------------
      - name: "Stage 2: FileSvidSourceTest"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-jeri \
            -Dtest=FileSvidSourceTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: SpiffeLoginModuleTest moved to qa/jtreg/net/jini/jeri/ssl/SpiffeLoginModule/
      # and is exercised via the qa integration test suite, not via Maven Surefire.

      # -----------------------------------------------------------------------
      # Stage 3 — SpiffeCredentialManagerTest
      # -----------------------------------------------------------------------
      - name: "Stage 3: SpiffeCredentialManagerTest"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-jeri \
            -Dtest=SpiffeCredentialManagerTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Summary — upload Surefire reports as an artifact for inspection
      # -----------------------------------------------------------------------
      - name: Upload Surefire reports
        if: ${{ always() && (!matrix.use-dirtychai || steps.check.outputs.skip == 'false') }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.jdk-label }}
          path: JGDMS/jgdms-jeri/target/surefire-reports/
          if-no-files-found: ignore
