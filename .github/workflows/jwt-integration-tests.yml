name: "JWT Integration Tests"

# Runs JwtLoginModuleTest (and supporting unit tests) on every push / PR that
# touches the JWT security module, and can be triggered manually.
#
# The test starts an embedded HTTPS JWKS server in-process using
# com.sun.net.httpserver.HttpsServer (jdk.httpserver module) and exercises the
# full JwtLoginModule JAAS lifecycle: initialize → login → commit / abort /
# logout.  No external OIDC/IdP service is required.
#
# Two Java variants are exercised:
#   1. Temurin 21 — always runs.  The JWT module requires --release 21 for
#      JDK API compatibility.
#   2. DirtyChai JDK — runs only when the dirty-chai-latest release is
#      available at pfirmstone/DirtyChai.  DirtyChai is a community OpenJDK
#      fork that re-enables SecurityManager / AccessController for full
#      JGDMS security coverage.

on:
  workflow_dispatch:
  push:
    paths:
      - 'JGDMS/jgdms-security-jwt/**'
      - 'JGDMS/jgdms-platform/**'
      - '.github/workflows/jwt-integration-tests.yml'
  pull_request:
    paths:
      - 'JGDMS/jgdms-security-jwt/**'
      - 'JGDMS/jgdms-platform/**'
      - '.github/workflows/jwt-integration-tests.yml'

permissions:
  contents: read

jobs:
  jwt-tests:
    name: "JWT tests (${{ matrix.jdk-label }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk-label: "Temurin-21"
            use-dirtychai: false
            java-version: '21'
          - jdk-label: "DirtyChai (if available)"
            use-dirtychai: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Install JDK 21 via actions/setup-java for the Temurin matrix leg.
      # The ubuntu-latest runner ships JDK 17 by default; the JWT module
      # requires --release 21 so we must install JDK 21 explicitly.
      # The DirtyChai leg uses its own JDK and skips this step.
      # -----------------------------------------------------------------------
      - name: Set up JDK 21 (Temurin)
        if: ${{ !matrix.use-dirtychai }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      # -----------------------------------------------------------------------
      # Install DirtyChai JDK (only for the DirtyChai matrix variant).
      # Degrades gracefully when the dirty-chai-latest release is absent.
      # -----------------------------------------------------------------------
      - name: Install DirtyChai JDK
        id: dirtychai
        if: matrix.use-dirtychai
        run: |
          INSTALL_DIR="/opt/dirtychai"
          DL_DIR="/tmp/dirtychai-dl"
          sudo mkdir -p "$INSTALL_DIR"
          mkdir -p "$DL_DIR"

          if gh release download dirty-chai-latest \
               --repo pfirmstone/DirtyChai \
               --pattern 'jdk-linux-x64.tar.gz' \
               --pattern 'jdk-linux-x64.tar.gz.sha256' \
               --dir "$DL_DIR"; then

            echo "DirtyChai release bundle found; verifying checksum..."
            (cd "$DL_DIR" && sha256sum -c jdk-linux-x64.tar.gz.sha256)

            echo "Checksum OK; installing..."
            sudo tar -xzf "$DL_DIR/jdk-linux-x64.tar.gz" -C "$INSTALL_DIR"

            JDK_DIR="$(dirname "$(find "$INSTALL_DIR" -name 'javac' -type f | head -1)")"
            JDK_DIR="${JDK_DIR%/bin}"

            echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
            echo "$JDK_DIR/bin"       >> "$GITHUB_PATH"
            echo "installed=true"     >> "$GITHUB_OUTPUT"

            echo "DirtyChai JDK installed at $JDK_DIR"
            "$JDK_DIR/bin/java" -version
          else
            echo "No DirtyChai release available; skipping DirtyChai matrix run."
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Skip remaining steps when DirtyChai was requested but unavailable.
      - name: Check DirtyChai availability
        id: check
        if: matrix.use-dirtychai
        run: |
          if [ "${{ steps.dirtychai.outputs.installed }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Maven dependency cache
      # -----------------------------------------------------------------------
      - name: Cache Maven local repository
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-jwt-${{ hashFiles('JGDMS/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-jwt-
            ${{ runner.os }}-maven-

      # -----------------------------------------------------------------------
      # Pre-install Pack200-ex-openjdk from GitHub Releases into the local
      # Maven repository (required transitive dependency).
      # -----------------------------------------------------------------------
      - name: Install Pack200-ex-openjdk into local Maven repository
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PACK_VER=$(grep -m1 '<pack200.version>' pom.xml | sed 's|.*<pack200.version>\(.*\)</pack200.version>.*|\1|')
          mkdir -p /tmp/pack200-dl
          gh release download "${PACK_VER}" \
            --repo pfirmstone/Pack200-ex-openjdk \
            --pattern "Pack200-ex-openjdk-${PACK_VER}.jar" \
            --dir /tmp/pack200-dl
          mvn install:install-file \
            -Dfile="/tmp/pack200-dl/Pack200-ex-openjdk-${PACK_VER}.jar" \
            -DgroupId=au.net.zeus.pack200-ex-openjdk \
            -DartifactId=Pack200-ex-openjdk \
            -Dversion="${PACK_VER}" \
            -Dpackaging=jar \
            --no-transfer-progress -q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Build jgdms-platform (required by jgdms-security-jwt at compile time)
      # -----------------------------------------------------------------------
      - name: Build dependencies (jgdms-platform)
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          mvn install -DskipTests \
            -pl jgdms-platform --also-make \
            --no-transfer-progress -q
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 1 — JwksJsonParserTest (JSON parsing, no HTTP)
      # -----------------------------------------------------------------------
      - name: "Stage 1: JwksJsonParserTest"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-security-jwt \
            -Dtest=JwksJsonParserTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 2 — JwtPrincipalTest (principal equality / serialisation)
      # -----------------------------------------------------------------------
      - name: "Stage 2: JwtPrincipalTest"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-security-jwt \
            -Dtest=JwtPrincipalTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Stage 3 — JwtLoginModuleTest (full integration: embedded HTTPS server)
      #
      # Requires jdk.httpserver (--add-modules jdk.httpserver configured in
      # jgdms-security-jwt/pom.xml via maven-surefire-plugin argLine).
      # The test generates an ephemeral RSA-2048 key pair for JWT signing and
      # a self-signed TLS certificate for the HTTPS JWKS server using keytool.
      # -----------------------------------------------------------------------
      - name: "Stage 3: JwtLoginModuleTest (embedded HTTPS JWKS server)"
        if: ${{ !matrix.use-dirtychai || steps.check.outputs.skip == 'false' }}
        working-directory: JGDMS
        run: |
          PROFILE_FLAG=""
          [ "${{ matrix.use-dirtychai }}" = "true" ] && PROFILE_FLAG="-Pdirtychai"
          mvn test -pl jgdms-security-jwt \
            -Dtest=JwtLoginModuleTest \
            $PROFILE_FLAG \
            --no-transfer-progress
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Summary — upload Surefire reports as an artifact for inspection
      # -----------------------------------------------------------------------
      - name: Upload Surefire reports
        if: ${{ always() && (!matrix.use-dirtychai || steps.check.outputs.skip == 'false') }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jwt-${{ matrix.jdk-label }}
          path: JGDMS/jgdms-security-jwt/target/surefire-reports/
          if-no-files-found: ignore
