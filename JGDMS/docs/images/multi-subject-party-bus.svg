<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <!-- Sky / road background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9E8FF"/>
      <stop offset="100%" stop-color="#E8F5FF"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#sky)"/>
  <!-- Road -->
  <rect y="320" width="800" height="80" fill="url(#road)"/>
  <!-- Road markings -->
  <rect y="356" width="800" height="8" fill="#555"/>
  <rect x="20"  y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="110" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="200" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="290" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="380" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="470" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="560" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="650" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <rect x="740" y="358" width="50" height="4" fill="#FFF" opacity="0.5"/>
  <!-- Pavement -->
  <rect y="400" width="800" height="80" fill="#A0905E"/>
  <!-- Kerb -->
  <rect y="395" width="800" height="8" fill="#D0C090"/>

  <!-- === PARTY BUS === -->
  <!-- Bus body -->
  <rect x="30" y="196" width="420" height="156" rx="14" fill="#FFD700"/>
  <!-- Bus roof curve -->
  <path d="M44 196 Q240 178 436 196" fill="#FFC200" stroke="none"/>
  <!-- Bus front cab -->
  <rect x="420" y="230" width="70" height="122" rx="10" fill="#FFD700"/>
  <!-- Windshield -->
  <rect x="430" y="240" width="52" height="54" rx="6" fill="#aaddff" opacity="0.85"/>
  <!-- Windshield glare -->
  <rect x="432" y="243" width="20" height="18" rx="4" fill="white" opacity="0.4"/>
  <!-- Bus wheels -->
  <circle cx="120" cy="390" r="28" fill="#222"/>
  <circle cx="120" cy="390" r="16" fill="#888"/>
  <circle cx="120" cy="390" r="7"  fill="#bbb"/>
  <circle cx="340" cy="390" r="28" fill="#222"/>
  <circle cx="340" cy="390" r="16" fill="#888"/>
  <circle cx="340" cy="390" r="7"  fill="#bbb"/>
  <circle cx="450" cy="390" r="28" fill="#222"/>
  <circle cx="450" cy="390" r="16" fill="#888"/>
  <circle cx="450" cy="390" r="7"  fill="#bbb"/>
  <!-- Bus windows (passenger) — 5 windows + front windshield -->
  <rect x="48"  y="216" width="64" height="46" rx="6" fill="#aaddff" opacity="0.8"/>
  <rect x="124" y="216" width="64" height="46" rx="6" fill="#aaddff" opacity="0.8"/>
  <rect x="200" y="216" width="64" height="46" rx="6" fill="#aaddff" opacity="0.8"/>
  <rect x="276" y="216" width="64" height="46" rx="6" fill="#aaddff" opacity="0.8"/>
  <rect x="352" y="216" width="60" height="46" rx="6" fill="#aaddff" opacity="0.8"/>
  <!-- "JERI 0x02 MULTI-SUBJECT EXPRESS" sign on bus side -->
  <rect x="48" y="276" width="364" height="32" rx="5" fill="#1a237e"/>
  <text x="230" y="297" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="900"
        fill="#FFD700" letter-spacing="1">JERI 0x02 — MULTI-SUBJECT EXPRESS</text>
  <!-- Luggage/JWT badges below sign -->
  <rect x="48"  y="318" width="60" height="22" rx="4" fill="#cc3300"/>
  <text x="78"  y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">JWT:alice</text>
  <rect x="120" y="318" width="60" height="22" rx="4" fill="#1565C0"/>
  <text x="150" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">JWT:bob</text>
  <rect x="192" y="318" width="70" height="22" rx="4" fill="#2e7d32"/>
  <text x="227" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">JWT:system</text>
  <rect x="274" y="318" width="76" height="22" rx="4" fill="#6a1f7c"/>
  <text x="312" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">+13 more…</text>

  <!-- === PASSENGERS VISIBLE IN WINDOWS (tiny faces) === -->
  <!-- Window 1: face -->
  <circle cx="80"  cy="236" r="12" fill="#f5c397"/>
  <circle cx="75"  cy="233" r="3" fill="#333"/>
  <circle cx="85"  cy="233" r="3" fill="#333"/>
  <path   d="M76 242 Q80 247 84 242" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Window 2 -->
  <circle cx="156" cy="236" r="12" fill="#d4956a"/>
  <circle cx="151" cy="233" r="3" fill="#333"/>
  <circle cx="161" cy="233" r="3" fill="#333"/>
  <path   d="M152 242 Q156 247 160 242" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Window 3 -->
  <circle cx="232" cy="236" r="12" fill="#f5c397"/>
  <circle cx="227" cy="233" r="3" fill="#333"/>
  <circle cx="237" cy="233" r="3" fill="#333"/>
  <path   d="M228 242 Q232 247 236 242" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Window 4 -->
  <circle cx="308" cy="236" r="12" fill="#c8a08a"/>
  <circle cx="303" cy="233" r="3" fill="#333"/>
  <circle cx="313" cy="233" r="3" fill="#333"/>
  <path   d="M304 242 Q308 247 312 242" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Window 5: waving hand visible -->
  <circle cx="382" cy="236" r="12" fill="#f5c397"/>
  <circle cx="377" cy="233" r="3" fill="#333"/>
  <circle cx="387" cy="233" r="3" fill="#333"/>
  <path   d="M378 242 Q382 247 386 242" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Waving hand out window 5 -->
  <path d="M392 230 Q402 218 406 230" fill="none" stroke="#d4956a" stroke-width="4" stroke-linecap="round"/>
  <!-- Driver in windshield -->
  <circle cx="460" cy="260" r="12" fill="#d4956a"/>
  <circle cx="455" cy="257" r="3" fill="#111"/>
  <circle cx="465" cy="257" r="3" fill="#111"/>
  <rect   x="452" y="265" width="16" height="4" rx="2" fill="#111" opacity="0.5"/>

  <!-- "16 Subjects × 64 Principals" badge on bus roof/top -->
  <rect x="100" y="182" width="240" height="18" rx="5" fill="#1a237e" opacity="0.88"/>
  <text x="220" y="195" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFD700">
    MAX 16 Subjects · MAX 64 Principals each
  </text>

  <!-- === SERVICE ENDPOINT (right building) === -->
  <rect x="600" y="100" width="180" height="230" rx="8" fill="#37474F"/>
  <!-- Building windows -->
  <rect x="616" y="120" width="36" height="28" rx="3" fill="#FFF176"/>
  <rect x="664" y="120" width="36" height="28" rx="3" fill="#FFF176"/>
  <rect x="712" y="120" width="52" height="28" rx="3" fill="#FFF176"/>
  <rect x="616" y="164" width="36" height="28" rx="3" fill="#FFF176"/>
  <rect x="664" y="164" width="36" height="28" rx="3" fill="#FFF176"/>
  <rect x="712" y="164" width="52" height="28" rx="3" fill="#aaddff" opacity="0.8"/>
  <rect x="616" y="208" width="36" height="28" rx="3" fill="#FFF176"/>
  <rect x="664" y="208" width="36" height="28" rx="3" fill="#FFF176"/>
  <!-- Door -->
  <rect x="660" y="282" width="60" height="48" rx="4" fill="#222"/>
  <circle cx="712" cy="307" r="4" fill="#FFD700"/>
  <!-- Building sign -->
  <rect x="604" y="254" width="172" height="26" rx="4" fill="#1a237e"/>
  <text x="690" y="271" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="11" font-weight="900" fill="#FFD700">JGDMS SERVICE</text>
  <!-- Building SPIFFE badge -->
  <path d="M604 100 L604 156 Q604 178 624 180 Q644 178 644 156 L644 100 Q624 93 604 100 Z"
        fill="#1B3D8A"/>
  <text x="624" y="128" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="7.5" font-weight="bold" fill="#aad4ff">SPIFFE</text>
  <rect x="615" y="140" width="18" height="13" rx="2" fill="#FFD700"/>
  <path d="M619 140 Q619 133 624 133 Q629 133 629 140"
        fill="none" stroke="#FFD700" stroke-width="2.5"/>

  <!-- Arrow from bus to service -->
  <path d="M500 300 Q550 290 590 302"
        fill="none" stroke="#cc3300" stroke-width="4" stroke-linecap="round"
        marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#cc3300" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Service speech bubble (right side) -->
  <path d="M560 80
           L768 80 Q780 80 780 92
           L780 176 Q780 188 768 188
           L590 188 Q578 188 578 176
           L578 162 L560 175 L578 150
           L578 92 Q578 80 590 80 Z"
        fill="white" stroke="#888" stroke-width="1.5"/>
  <text x="679" y="102" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#333">Hang on, let me check</text>
  <text x="679" y="118" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="11" fill="#333">the manifest…</text>
  <text x="679" y="136" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1565C0">ClientUserSubject</text>
  <text x="679" y="151" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#555">.getUserSubjects()</text>
  <text x="679" y="169" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" fill="#888">→ Subject[16] 🎉</text>

  <!-- Bottom caption / footnote -->
  <rect x="0" y="432" width="800" height="48" fill="#1a237e"/>
  <text x="400" y="452" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="900" fill="#FFD700">
    JERI Protocol 0x02 — Multi-Subject Identity Wire Transfer
  </text>
  <text x="400" y="470" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="10" fill="#90CAF9">
    Up to 16 UserSubjects × 64 principals each · Server receives Subject[] via ClientUserSubject.getUserSubjects()
  </text>
</svg>
