<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="593px" preserveAspectRatio="none" style="width:777px;height:593px;background:#FFFFFF;" version="1.1" viewBox="0 0 777 593" width="777px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="260.133" x="255.1835" y="24.9659">Resolving a class name from the wire</text></g><!--entity A0--><g class="entity" data-qualified-name="A0" data-source-line="15" id="ent0001"><rect fill="#EFEFEF" height="39.0679" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="298.4729" x="236" y="52.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="63.9798" x="246" y="77.0339">Standard</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.8532" x="313.6197" y="77.0339">ObjectInputStream.resolveClass</text></g><!--entity A1--><g class="entity" data-qualified-name="A1" data-source-line="16" id="ent0002"><rect fill="#FBE9E7" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="287.091" x="86.5" y="127.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="132.8315" x="96.5" y="152.0339">walk the call stack &#8594;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="175.4613" x="96.5" y="171.1018">latestUserDefinedLoader</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="84.3497" x="279.2413" y="171.1018">(or the TCCL)</text></g><!--entity A2--><g class="entity" data-qualified-name="A2" data-source-line="17" id="ent0003"><rect fill="#FBE9E7" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="247.4292" x="82.5" y="221.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.6715" x="92.5" y="246.0339">a loader picked by</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="227.4292" x="92.5" y="265.1018">whatever happens to be on the stack</text></g><!--entity A3--><g class="entity" data-qualified-name="A3" data-source-line="18" id="ent0004"><rect fill="#F4B5AE" height="77.2038" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="348.1868" x="6" y="315.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="11.7305" x="16" y="340.0339">&#10007;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.7174" x="35.0104" y="340.0339">local copy / wrong loader</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="261.897" x="16" y="359.1018">type conflict &#183; undesired local resolution</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="328.1868" x="16" y="378.1697">(and no loader to find across bundles under OSGi)</text></g><!--entity B0--><g class="entity" data-qualified-name="B0" data-source-line="24" id="ent0008"><rect fill="#EFEFEF" height="39.0679" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="271.9851" x="404" y="136.5679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="27.1599" x="414" y="161.5339">JERI</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.1852" x="444.7999" y="161.5339">MarshalInputStream.resolveClass</text></g><!--entity B1--><g class="entity" data-qualified-name="B1" data-source-line="25" id="ent0009"><rect fill="#E6F4EA" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="384.0686" x="361" y="221.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="99.0776" x="371" y="246.0339">defaultLoader</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="103.2776" x="473.7176" y="246.0339">assigned by the</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="63.4058" x="580.6352" y="246.0339">endpoint</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="364.0686" x="371" y="265.1018">(BasicInvocationDispatcher) + the codebase on the wire</text></g><!--entity B2--><g class="entity" data-qualified-name="B2" data-source-line="26" id="ent0010"><rect fill="#E6F4EA" height="77.2038" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="388.7726" x="372.5" y="315.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="368.7726" x="382.5" y="340.0339">ClassLoading.loadClass(codebase, name, defaultLoader)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.0851" x="382.5" y="359.1018">&#8594; PreferredClassLoader[codebase],</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="161.5874" x="382.5" y="378.1697">parent = defaultLoader</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="184.5612" x="551.3674" y="378.1697">(= client bundle under OSGi)</text></g><!--entity B3--><g class="entity" data-qualified-name="B3" data-source-line="27" id="ent0011"><rect fill="#B7E1C4" height="82.6517" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="334.2833" x="400" y="428.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="11.7305" x="410" y="453.0339">&#10003;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.2728" x="429.0104" y="453.0339">shared API via the parent &#8594; one type identity</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.4574" x="410" y="472.1018">impl child-first &#8594; isolated</text><text fill="#000000" font-family="Helvetica" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="290.3742" x="410" y="495.4456">the right class, deterministically</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="35" id="ent0017"><path d="M379.5,547.0679 L379.5,592.4799 A0,0 0 0 0 379.5,592.4799 L754.2303,592.4799 A0,0 0 0 0 754.2303,592.4799 L754.2303,557.0679 L744.2303,547.0679 L571,547.0679 L567,511.2774 L563,547.0679 L379.5,547.0679 A0,0 0 0 0 379.5,547.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M744.2303,547.0679 L744.2303,557.0679 L754.2303,557.0679 L744.2303,547.0679" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="348.2962" x="385.5" y="565.9649">No call stack, no TCCL: resolution is a function of the wire</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="60.8661" x="385.5" y="583.6709">codebase</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="46.761" x="449.7461" y="583.6709">and the</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="113.8541" x="499.8871" y="583.6709">endpoint's loader</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="122.1091" x="617.1212" y="583.6709">&#8212; nothing ambient.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" id="lnk5"><polygon fill="#6E6E6E" points="282.6407,127.0495,292.4648,126.3518,287.0544,124.7003,288.706,119.2899,282.6407,127.0495" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M350.215,91.0825 C330.3109,101.6767 309.3539,112.8312 287.0544,124.7003" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#6E6E6E" points="213.369,220.8201,219.5113,213.1212,214.6311,215.982,211.7703,211.1018,213.369,220.8201" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M222.6688,185.1708 C219.7188,196.4792 217.5849,204.6591 214.6311,215.982" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#6E6E6E" points="189.6809,314.7753,195.7891,307.0494,190.9216,309.9317,188.0393,305.0642,189.6809,314.7753" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M198.8266,279.0719 C196.0007,290.1035 193.9525,298.0993 190.9216,309.9317" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" id="lnk12"><polygon fill="#6E6E6E" points="549.04,221.0432,551.7414,211.5721,548.3404,216.0924,543.8201,212.6914,549.04,221.0432" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M542.6307,175.6855 C544.4707,188.7068 546.2615,201.3798 548.3404,216.0924" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" data-link-type="dependency" id="lnk13"><polygon fill="#6E6E6E" points="561.7872,314.7753,564.52,305.3132,561.104,309.8222,556.595,306.4063,561.7872,314.7753" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M556.8626,279.0719 C558.3842,290.1035 559.472,297.9899 561.104,309.8222" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk14"><polygon fill="#6E6E6E" points="567,427.8238,571,418.8238,567,422.8238,563,418.8238,567,427.8238" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M567,392.2117 C567,403.6262 567,411.2157 567,422.8238" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g></g></svg>