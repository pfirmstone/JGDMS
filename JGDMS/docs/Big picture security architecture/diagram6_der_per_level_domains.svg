<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="617px" preserveAspectRatio="none" style="width:1621px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 1621 617" width="1621px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="189.1953" x="712.6524" y="24.9659">One object, three domains:</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="439.8083" x="587.3459" y="44.0339">@AtomicSerial + DER resolve every inheritance level separately</text></g><g class="entity" data-qualified-name="N1" data-source-line="23" id="ent0001"><path d="M6,71.1358 L6,222.784 L411.1893,222.784 L411.1893,81.1358 L401.1893,71.1358 L6,71.1358" fill="#FFF6D6" style="stroke:#C9A93B;stroke-width:0.5;"/><path d="M401.1893,71.1358 L401.1893,81.1358 L411.1893,81.1358 L401.1893,71.1358" fill="#FFF6D6" style="stroke:#C9A93B;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="90.0121" x="12" y="90.0328">One object is a</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="126.4901" x="105.3921" y="90.0328">stack of class levels</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.484" x="231.8822" y="90.0328">.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="158.1971" x="12" y="107.7389">Each level authors its own</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="220.0381" x="12" y="125.4449">serialForm() / serialize() / (GetArg)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="13" x="235.4181" y="125.4449">&#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="199.3942" x="12" y="143.1509">the wire ABI, never a field dump.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.5751" x="12" y="160.8569">Each level is resolved by</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="149.7861" x="161.9551" y="160.8569">its own defining loader</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.484" x="311.7412" y="160.8569">,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="176.9172" x="12" y="178.5629">and that single loader settles</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="131.4171" x="192.2972" y="178.5629">three things at once</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.484" x="323.7142" y="178.5629">:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="83.3951" x="12" y="196.2689">type identity (</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="73.7491" x="95.3951" y="196.2689">namespace</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.0991" x="169.1441" y="196.2689">) &#183; package-private scope</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="117.2731" x="12" y="213.975">(&#8658; the per-package</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="111.1891" x="132.6531" y="213.975">MarshalDelegate</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="95.5631" x="243.8422" y="213.975">) &#183; permissions (</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="49.4" x="339.4053" y="213.975">domain</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="7.384" x="388.8053" y="213.975">).</text></g><!--entity L1--><g class="entity" data-qualified-name="L1" data-source-line="34" id="ent0002"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="129.1716" x="429" y="118.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.7037" x="439" y="143.1018">PlatformBase</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="109.1716" x="439" y="162.1697">&#171;@AtomicSerial&#187;</text></g><!--entity CL1--><g class="entity" data-qualified-name="CL1" data-source-line="35" id="ent0003"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="124.0756" x="576.5" y="118.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.0756" x="586.5" y="143.1018">defining loader:</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.8518" x="586.5" y="162.1697">platform</text></g><!--entity ND1--><g class="entity" data-qualified-name="ND1" data-source-line="36" id="ent0004"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="232.6312" x="719" y="118.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.6312" x="729" y="143.1018">Namespace + ProtectionDomain</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.5413" x="729" y="162.1697">platform type-identity &amp; trust</text></g><!--entity S1--><g class="entity" data-qualified-name="S1" data-source-line="37" id="ent0005"><rect fill="#FBFBFB" height="39.0679" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="168.0214" x="970.5" y="127.6358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.0214" x="980.5" y="152.6018">schema(PlatformBase)</text></g><!--entity L2--><g class="entity" data-qualified-name="L2" data-source-line="43" id="ent0009"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="129.1716" x="429" y="280.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.9717" x="439" y="305.1018">ServiceProxy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="109.1716" x="439" y="324.1697">&#171;@AtomicSerial&#187;</text></g><!--entity CL2--><g class="entity" data-qualified-name="CL2" data-source-line="44" id="ent0010"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="124.0756" x="577.5" y="280.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.0756" x="587.5" y="305.1018">defining loader:</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="78.8477" x="587.5" y="324.1697">codebase A</text></g><!--entity ND2--><g class="entity" data-qualified-name="ND2" data-source-line="45" id="ent0011"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="232.6312" x="721" y="280.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.6312" x="731" y="305.1018">Namespace + ProtectionDomain</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="211.4692" x="731" y="324.1697">codebase-A type-identity &amp; trust</text></g><!--entity S2--><g class="entity" data-qualified-name="S2" data-source-line="46" id="ent0012"><rect fill="#FBFBFB" height="39.0679" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="163.2894" x="973" y="289.6358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.2894" x="983" y="314.6018">schema(ServiceProxy)</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" data-source-line="52" id="ent0016"><rect fill="#FBFBFB" height="77.2038" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="129.1716" x="427" y="408.6358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.5856" x="437" y="433.6018">ConcreteProxy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="109.1716" x="437" y="452.6697">&#171;@AtomicSerial&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="94.8776" x="437" y="471.7376">(most derived)</text></g><!--entity CL3--><g class="entity" data-qualified-name="CL3" data-source-line="53" id="ent0017"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="124.0756" x="574.5" y="418.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.0756" x="584.5" y="443.1018">defining loader:</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="78.5957" x="584.5" y="462.1697">codebase B</text></g><!--entity ND3--><g class="entity" data-qualified-name="ND3" data-source-line="54" id="ent0018"><rect fill="#FBFBFB" height="58.1358" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="232.6312" x="717" y="418.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.6312" x="727" y="443.1018">Namespace + ProtectionDomain</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="211.6232" x="727" y="462.1697">codebase-B type-identity &amp; trust</text></g><!--entity S3--><g class="entity" data-qualified-name="S3" data-source-line="55" id="ent0019"><rect fill="#FBFBFB" height="39.0679" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="175.9034" x="968.5" y="427.6358"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.9034" x="978.5" y="452.6018">schema(ConcreteProxy)</text></g><!--entity MI--><g class="entity" data-qualified-name="MI" data-source-line="69" id="ent0027"><rect fill="#FFFFE0" height="104.2717" rx="5" ry="5" style="stroke:#9A9A9A;stroke-width:0.5;" width="376.9286" x="1163" y="395.1358"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="170.1833" x="1173" y="420.1018">DER MarshalledInstance</text><line style="stroke:#9A9A9A;stroke-width:1;" x1="1164" x2="1538.9286" y1="424.2038" y2="424.2038"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.0457" x="1173" y="443.1697">payloadBytes</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="356.9286" x="1173" y="462.2376">schemaBytes / schemaDigest  (leaf commits the chain)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.1775" x="1173" y="481.3055">codebaseAnnotation</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="73" id="ent0030"><path d="M1097.5,536.1358 L1097.5,616.9599 A0,0 0 0 0 1097.5,616.9599 L1605.7404,616.9599 A0,0 0 0 0 1605.7404,616.9599 L1605.7404,546.1358 L1595.7404,536.1358 L1355.5,536.1358 L1351.5,499.2603 L1347.5,536.1358 L1097.5,536.1358 A0,0 0 0 0 1097.5,536.1358" fill="#FFF6D6" style="stroke:#C9A93B;stroke-width:0.5;"/><path d="M1595.7404,536.1358 L1595.7404,546.1358 L1605.7404,546.1358 L1595.7404,536.1358" fill="#FFF6D6" style="stroke:#C9A93B;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="176.8911" x="1103.5" y="555.0328">Self-describing on the wire:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="191.5811" x="1103.5" y="572.7389">&#8226; a Java reader runs each level's</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="54.652" x="1298.4611" y="572.7389">(GetArg)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="11.388" x="1356.4931" y="572.7389">in</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="99.944" x="1371.2612" y="572.7389">its own domain</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="409.7602" x="1110.26" y="590.4449">&#8212; a downloaded subclass cannot reach a trusted superclass's slice;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="245.4792" x="1103.5" y="608.1509">&#8226; a non-Java reader decodes the payload</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="110.3571" x="1352.3592" y="608.1509">from the schema</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.6441" x="1466.0963" y="608.1509">&#8212; no class required.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#6E6E6E" points="576.2927,147.1358,567.2927,143.1358,571.2927,147.1358,567.2927,151.1358,576.2927,147.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M558.0703,147.1358 C564.1444,147.1358 565.2185,147.1358 571.2927,147.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#6E6E6E" points="718.9806,147.1358,709.9806,143.1358,713.9806,147.1358,709.9806,151.1358,718.9806,147.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M700.832,147.1358 C706.8816,147.1358 707.9311,147.1358 713.9806,147.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#6E6E6E" points="970.2413,147.1358,961.2413,143.1358,965.2413,147.1358,961.2413,151.1358,970.2413,147.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M952.2715,147.1358 C958.2614,147.1358 959.2514,147.1358 965.2413,147.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" data-link-type="dependency" id="lnk13"><polygon fill="#6E6E6E" points="577.278,309.1358,568.278,305.1358,572.278,309.1358,568.278,313.1358,577.278,309.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M558.2305,309.1358 C564.5797,309.1358 565.9288,309.1358 572.278,309.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk14"><polygon fill="#6E6E6E" points="720.8499,309.1358,711.8499,305.1358,715.8499,309.1358,711.8499,313.1358,720.8499,309.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M701.7617,309.1358 C708.1245,309.1358 709.4872,309.1358 715.8499,309.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk15"><polygon fill="#6E6E6E" points="972.8866,309.1358,963.8866,305.1358,967.8866,309.1358,963.8866,313.1358,972.8866,309.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M954.0527,309.1358 C960.3307,309.1358 961.6086,309.1358 967.8866,309.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0016" data-entity-2="ent0017" data-link-type="dependency" id="lnk20"><polygon fill="#6E6E6E" points="574.2927,447.1358,565.2927,443.1358,569.2927,447.1358,565.2927,451.1358,574.2927,447.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M556.0703,447.1358 C562.1444,447.1358 563.2185,447.1358 569.2927,447.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0017" data-entity-2="ent0018" data-link-type="dependency" id="lnk21"><polygon fill="#6E6E6E" points="716.9806,447.1358,707.9806,443.1358,711.9806,447.1358,707.9806,451.1358,716.9806,447.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M698.832,447.1358 C704.8816,447.1358 705.9311,447.1358 711.9806,447.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0018" data-entity-2="ent0019" data-link-type="dependency" id="lnk22"><polygon fill="#6E6E6E" points="968.4923,447.1358,959.4923,443.1358,963.4923,447.1358,959.4923,451.1358,968.4923,447.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M950.2266,447.1358 C956.3151,447.1358 957.4037,447.1358 963.4923,447.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0012" data-link-type="dependency" id="lnk25"><polygon fill="#6E6E6E" points="1054.5,289.5876,1058.5,280.5876,1054.5,284.5876,1050.5,280.5876,1054.5,289.5876" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1054.5,166.803 C1054.5,197.6333 1054.5,253.8355 1054.5,284.5876" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.0871" x="1056.5" y="257.0328">SHA-256(parent)</text></g><g class="link" data-entity-1="ent0012" data-entity-2="ent0019" data-link-type="dependency" id="lnk26"><polygon fill="#6E6E6E" points="1056.223,427.2993,1060.0902,418.2414,1056.1495,422.2998,1052.0911,418.3591,1056.223,427.2993" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1054.7739,328.7609 C1055.1548,354.6592 1055.767,396.2892 1056.1495,422.2998" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="100.0871" x="1056.5" y="372.0328">SHA-256(parent)</text></g><g class="link" data-entity-1="ent0019" data-entity-2="ent0027" data-link-type="dependency" id="lnk28"><polygon fill="#6E6E6E" points="1162.8341,447.1358,1153.8341,443.1358,1157.8341,447.1358,1153.8341,451.1358,1162.8341,447.1358" style="stroke:#6E6E6E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1144.6543,447.1358 C1150.7142,447.1358 1151.7742,447.1358 1157.8341,447.1358" fill="none" style="stroke:#6E6E6E;stroke-width:1;"/></g></g></svg>