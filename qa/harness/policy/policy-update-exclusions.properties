# Policy files that must NOT be modified by the policy-update build option.
# These files are deliberately restrictive so that tests can observe a
# SecurityException.  Granting additional permissions to these files would
# break those tests.
#
# Each entry is the basename (filename only, no directory) of a protected
# policy file.  PolicyUpdatePostProcessor reads this file and restores any
# matching policy file to its VCS-tracked state after a SecurityPolicyWriter
# test run, and skips condensing them.
loaderNoDlPerm.policy
loaderNoGetClassLoader.policy
loaderNoConnectToCodebase.policy
policyProviderNoAccessClass.policy
policyProviderNoGetProperty.policy
