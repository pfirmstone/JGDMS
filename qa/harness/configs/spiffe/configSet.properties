#
# required options/properties when running in the spiffe configuration group
#
# Uses SPIFFE X.509-SVID credentials loaded from PEM files via
# SpiffeLoginModule, in place of PKCS12 keystores used by the jsse config set.
#
# Before running, generate test SVIDs with:
#   cd qa/harness/trust && bash gen-spiffe-svids.sh
#
# append to global vm args - no cosmetic whitespace
org.apache.river.qa.harness.globalvmargs=${org.apache.river.qa.harness.globalvmargs},\
-Djava.protocol.handler.pkgs=net.jini.url,\
-Djava.security.auth.login.config=<url:harness/trust/spiffelogins>,\
-Djavax.net.ssl.trustStore=<file:harness/trust/spiffetrust.jks>,\
-Djavax.net.ssl.trustStorePassword=spiffetrustpw,\
-Djavax.net.ssl.trustStoreType=JKS,\
-Dorg.apache.river.discovery.x500.trustStore=<url:harness/trust/spiffetrust.jks>,\
-Dnet.jini.jeri.ssl.spiffe.dir=<file:harness/trust/spiffe>,\
-Djava.security.properties=<url:harness/trust/dynamic-policy.properties>,\
#-Djava.security.manager=default

org.apache.river.qa.harness.integrityhash=sha-256,sha-384

// spiffe policy files
net.jini.lease.LeaseRenewalService.policyfile=<url:harness/policy/defaultspiffenorm.policy>
net.jini.core.lookup.ServiceRegistrar.policyfile=<url:harness/policy/defaultspiffereggie.policy>
net.jini.discovery.LookupDiscoveryService.policyfile=<url:harness/policy/defaultspiffefiddler.policy>
net.jini.event.EventMailbox.policyfile=<url:harness/policy/defaultspiffemercury.policy>
net.jini.event.PullEventMailbox.policyfile=<url:harness/policy/defaultspiffemercury.policy>
net.jini.core.transaction.server.TransactionManager.policyfile=<url:harness/policy/defaultspiffemahalo.policy>
net.jini.space.JavaSpace.policyfile=<url:harness/policy/defaultspiffeoutrigger.policy>
sharedGroup.policyfile=<url:harness/policy/defaultspiffesharedvm.policy>
sharedGroupImpl.policyfile=<url:harness/policy/defaultspiffegroup.policy>
activationSystem.policyfile=<url:harness/policy/defaultspiffephoenix.policy>
testPolicyfile=<url:harness/policy/defaultspiffetest.policy>

# bump norm slop way up from 5 seconds to 60 seconds
org.apache.river.qa.impl.norm.slop=40000
